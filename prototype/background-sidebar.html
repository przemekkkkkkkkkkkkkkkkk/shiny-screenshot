<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Background Sidebar Prototype</title>
<!-- PROTOTYPE, throwaway. Question: what should the Background sidebar on the capture overlay become?
     Four structurally different sidebars over the same live composition, all bound to one in-memory state.
     Switch with the bottom bar, ?variant=A..D, or the ← → keys. Nothing persists. -->
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --acc:#FFD60A;--on-acc:#1a1500;
  --glass:rgba(246,246,250,.66);--rim:rgba(255,255,255,.8);--line:rgba(0,0,0,.08);
  --fg:#1d1d1f;--fg2:rgba(0,0,0,.55);--fg3:rgba(0,0,0,.35);--fill:rgba(0,0,0,.05);--fill2:rgba(0,0,0,.1);
  --pop:rgba(255,255,255,.92);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --glass:rgba(30,30,36,.6);--rim:rgba(255,255,255,.16);--line:rgba(255,255,255,.08);
  --fg:#f5f5f7;--fg2:rgba(255,255,255,.58);--fg3:rgba(255,255,255,.32);--fill:rgba(255,255,255,.06);--fill2:rgba(255,255,255,.12);
  --pop:rgba(40,40,46,.94);color-scheme:dark}}
:root[data-theme=dark]{
  --glass:rgba(30,30,36,.6);--rim:rgba(255,255,255,.16);--line:rgba(255,255,255,.08);
  --fg:#f5f5f7;--fg2:rgba(255,255,255,.58);--fg3:rgba(255,255,255,.32);--fill:rgba(255,255,255,.06);--fill2:rgba(255,255,255,.12);
  --pop:rgba(40,40,46,.94);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#111}
body{font:12.5px/1.35 var(--ui);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
input[type=range]{accent-color:var(--acc)}

/* ---------- the overlay scene ---------- */
#desk{position:fixed;inset:0;background:url(../ShinyScreenshot/Assets.xcassets/Wallpapers/Boreal.imageset/Boreal.jpg) center/cover}
#desk::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5)}
#scene{position:fixed;inset:0;display:flex}
#canvas{flex:1;position:relative;min-width:0}
#fit{position:absolute;left:0;top:0;transform-origin:0 0}
#side{position:relative;flex:none;display:flex;padding:16px 16px 76px 0;z-index:5}

.glass{background:var(--glass);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
  border-radius:22px;box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 .5px var(--line),0 30px 80px -24px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.25)}

/* dock toolbar (context only) */
#dock{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:16px;z-index:4}
#dock span{width:40px;height:34px;display:grid;place-items:center;border-radius:11px;color:var(--fg2)}
#dock span.on{background:var(--acc);color:var(--on-acc);box-shadow:0 0 18px rgba(255,214,10,.55)}

/* ---------- composition ---------- */
.comp{position:relative;overflow:hidden;display:flex;flex-direction:column}
.comp>.bgl{position:absolute;inset:-60px;background-size:cover;background-position:center}
.comp>.ovl{position:absolute;inset:0;pointer-events:none}
.comp>.content{position:relative;flex:1;display:flex;flex-direction:column;gap:22px}
.shot{flex:none;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.frame{position:relative;overflow:hidden;background:#fff;width:560px}
.fbar{display:none;align-items:center;gap:6px;height:28px;padding:0 11px;background:#f4f4f6;border-bottom:1px solid #e4e4e8}
.f-mac .fbar,.f-browser .fbar{display:flex}
.fbar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.fbar i:nth-child(2){background:#febc2e}.fbar i:nth-child(3){background:#28c840}
.fbar b{display:none;margin:0 auto;width:52%;height:17px;border-radius:5px;background:#e6e6ea;font:500 10px/17px var(--ui);color:#777;text-align:center}
.f-browser .fbar b{display:block}
.f-glass{padding:8px;background:rgba(255,255,255,.25)!important;border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(14px)}
.f-glass>.app{border-radius:inherit;overflow:hidden}
.f-outline{outline:3px solid rgba(255,255,255,.9);outline-offset:0}
.f-device{padding:14px;background:#1b1b1f!important;box-shadow:inset 0 0 0 1.5px #3a3a40}
.f-device>.app{border-radius:calc(var(--r) - 8px);overflow:hidden}
.heading{color:var(--tc)}
.heading .eb{font:600 11px/1 var(--ui);letter-spacing:.16em;opacity:.6;text-transform:uppercase;margin-bottom:8px}
.heading .t{font:700 34px/1.1 var(--ui);letter-spacing:-.01em}
.heading .d{font:400 16px/1.4 var(--ui);opacity:.72;margin-top:8px}
.h-editorial .t{font-family:"New York",Georgia,serif;font-weight:500}
.h-poster .t{font-weight:900;text-transform:uppercase;font-size:44px;letter-spacing:-.02em}
.h-caption .t{font-size:17px;font-weight:600}.h-caption .d{font-size:13px}

/* fake app inside the shot */
.app{display:grid;grid-template-columns:130px 1fr;height:330px;font:11px/1.3 var(--ui);color:#1e293b;background:#fff}
.app .nav{background:#f1f5f9;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.app .nav div{height:20px;border-radius:5px;padding:3px 7px;color:#475569}
.app .nav .on{background:#6366F1;color:#fff}
.app .main{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.app h4{margin:0;font-size:15px}
.app .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.app .card{border:1px solid #e2e8f0;border-radius:8px;padding:8px}
.app .card b{display:block;font-size:16px}
.app .bars{flex:1;display:flex;align-items:flex-end;gap:6px;border:1px solid #e2e8f0;border-radius:8px;padding:10px}
.app .bars i{flex:1;border-radius:3px 3px 0 0;background:#6366F1}
.app .bars i:nth-child(3n){background:#F59E0B}

/* ---------- shared controls ---------- */
.h{font-size:13px;font-weight:650;letter-spacing:-.01em}
.lbl{font-size:11.5px;color:var(--fg2)}
.cap{font-size:10.5px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{flex:1;padding:5px 6px;border-radius:7px;font-size:11.5px;font-weight:550;color:var(--fg2);white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 1px 6px rgba(255,214,10,.35)}
.row{display:flex;align-items:center;gap:10px}
.sl{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:8px;font-size:11.5px;color:var(--fg2)}
.sl input{width:100%;min-width:0}.sl output{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.tile{position:relative;border-radius:9px;aspect-ratio:16/10;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18);outline:2px solid transparent;outline-offset:2px;transition:transform .12s}
.tile:hover{transform:scale(1.05)}
.tile.on{outline-color:var(--acc)}
.tile .star{position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;display:none;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:10px;line-height:1}
.tile:hover .star,.tile .star.on{display:grid}.tile .star.on{color:var(--acc)}
.tile .nm{position:absolute;left:0;right:0;bottom:-15px;font-size:10px;color:var(--fg2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;gap:8px}
.vt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 6px;border-radius:10px;background:var(--fill);font-size:10.5px;color:var(--fg2)}
.vt.on{background:var(--fill2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--acc)}
.vt .ico{height:26px;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--fill2);font-size:11.5px;font-weight:550}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.field{width:100%;border:0;outline:0;background:var(--fill);border-radius:8px;padding:7px 9px;font-size:12px}
.field:focus{box-shadow:inset 0 0 0 1.5px var(--acc)}
.pos{display:grid;grid-template-columns:repeat(3,18px);gap:3px;padding:5px;border-radius:9px;background:var(--fill)}
.pos button{width:18px;height:14px;border-radius:4px;background:var(--fill2)}
.pos button.on{background:var(--acc)}
.sw{width:30px;height:18px;border-radius:9px;background:var(--fill2);position:relative;flex:none}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(12px)}
.scroll{overflow-y:auto;scrollbar-width:thin}
.chip{padding:4px 9px;border-radius:99px;background:var(--fill);font-size:11px;color:var(--fg2);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--glass)}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2);outline:2px solid transparent;outline-offset:2px}
.dot.on{outline-color:var(--acc)}

/* ---------- A: Inspector ---------- */
.A{width:316px;display:flex;flex-direction:column;overflow:hidden}
.A .hd{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.A .sec{border-top:.5px solid var(--line)}
.A .sec>button{width:100%;display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:600}
.A .sec>button .sum{margin-left:auto;font-weight:400;color:var(--fg3);font-size:11px}
.A .sec>button .chev{transition:.2s;color:var(--fg3)}.A .sec.open>button .chev{transform:rotate(90deg)}
.A .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:11px}
.A .sec:not(.open) .body{display:none}
.A .body>.seg button{padding:5px 3px;font-size:11px}

/* ---------- B: Looks ---------- */
.B{width:340px;display:flex;flex-direction:column;overflow:hidden}
.B .looks{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}
.look{border-radius:12px;overflow:hidden;text-align:left;background:var(--fill);outline:2px solid transparent;outline-offset:1px}
.look.on{outline-color:var(--acc)}
.look .mini{height:84px;position:relative;overflow:hidden;display:grid;place-items:center}
.look .mini .ms{width:62%;height:56%;background:#fff;position:relative}
.look .mini .ms::before{content:'';position:absolute;left:8%;top:22%;width:40%;height:8%;border-radius:2px;background:#cbd5e1;box-shadow:0 10px 0 #e2e8f0,0 20px 0 #e2e8f0}
.look .mini .ms::after{content:'';position:absolute;right:8%;bottom:12%;width:34%;height:36%;border-radius:3px;background:linear-gradient(90deg,#6366F1 30%,#F59E0B 30% 50%,#6366F1 50%)}
.look .lname{padding:6px 9px 7px;font-size:11.5px;font-weight:600}
.look .lname span{display:block;font-weight:400;font-size:10.5px;color:var(--fg2)}
.B .tabs{display:flex;gap:2px;margin:0 14px;padding:2px;border-radius:10px;background:var(--fill)}
.B .tabs button{flex:1;padding:6px 0;border-radius:8px;font-weight:550;color:var(--fg2);font-size:11.5px}
.B .tabs button.on{background:var(--pop);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.B .tune{padding:12px 14px 14px;display:flex;flex-direction:column;gap:11px}

/* ---------- C: Rail + flyout ---------- */
.C{display:flex;gap:10px;align-items:flex-start;height:100%}
.C .rail{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:18px}
.C .rail button{width:46px;height:46px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg2);font-size:9px;font-weight:600}
.C .rail button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 0 18px rgba(255,214,10,.5)}
.C .fly{width:430px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.C .fly .hd{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px}
.C .fly .bd{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.C .search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;padding:0 10px}
.C .search input{flex:1;border:0;outline:0;background:none;padding:8px 0}
.C .big{grid-template-columns:repeat(4,1fr);row-gap:24px}

/* ---------- D: Generator ---------- */
.D{width:330px;display:flex;flex-direction:column;overflow:hidden}
.D .hero{margin:0 14px;height:120px;border-radius:14px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.D .hero .gen{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.D .hero .gen button{padding:7px 12px;border-radius:10px;font-weight:650;background:rgba(255,255,255,.85);color:#111;backdrop-filter:blur(10px)}
.D .hero .gen button.acc{background:var(--acc);color:var(--on-acc);box-shadow:0 0 18px rgba(255,214,10,.6)}
.D .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.D .wells{display:flex;gap:8px;align-items:center}
.D .well{position:relative;width:38px;height:38px;border-radius:11px;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.D .well input{position:absolute;inset:-8px;width:60px;height:60px;border:0;padding:0;cursor:pointer;opacity:0}
.D .hist{display:flex;gap:5px}
.D .hist button{flex:1;height:24px;border-radius:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.D .pad{position:relative;height:120px;border-radius:12px;background:var(--fill);cursor:crosshair;touch-action:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:25% 25%}
.D .pad .knob{position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.3),0 0 18px rgba(255,214,10,.7)}
.D .pad .ax{position:absolute;font-size:10px;color:var(--fg3)}
.D .dial{width:44px;height:44px;border-radius:50%;background:var(--fill);position:relative;flex:none;cursor:grab;touch-action:none}
.D .dial i{position:absolute;left:50%;top:50%;width:2px;height:18px;margin-left:-1px;background:var(--acc);transform-origin:50% 0;border-radius:2px}

/* ---------- E: Everything ---------- */
.sty{position:relative}
.st-default{background:rgba(255,255,255,.35)}
.st-glass-light{background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(16px)}
.st-glass-dark{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(16px)}
.st-liquid{background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(22px) saturate(1.9)}
.st-liquid::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.9),inset 0 -1px 2px rgba(255,255,255,.35)}
.st-inset-light{background:#eef1f5;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.st-inset-dark{background:#1c1c20}
.st-outline{outline:2px solid rgba(255,255,255,.85);outline-offset:5px}
.st-border{border:6px solid #fff}
.f-macdark .fbar,.f-chrome .fbar,.f-windows .fbar{display:flex}
.f-macdark .fbar{background:#2a2a2e;border-color:#1c1c1f}
.f-chrome .fbar{background:#dee1e6;height:32px}.f-chrome .fbar b{display:block;background:#fff;border-radius:99px}
.f-windows .fbar{justify-content:flex-end;gap:16px;background:#f3f3f3;padding-right:14px}
.f-windows .fbar i{background:none!important;width:auto;height:auto;border-radius:0;font:normal 12px/1 var(--ui);color:#444}
.f-windows .fbar i:nth-child(1)::after{content:'—'}.f-windows .fbar i:nth-child(2)::after{content:'▢'}.f-windows .fbar i:nth-child(3)::after{content:'✕'}
.f-arc{padding:8px;background:linear-gradient(135deg,#c4b5fd,#f9a8d4)!important}.f-arc>.app{border-radius:calc(var(--r) - 4px);overflow:hidden}
.f-macbook{padding:12px;background:#111!important;border-bottom:18px solid #c9cbd1}
.f-ipad{padding:18px;background:#111!important;border-radius:28px!important}.f-ipad>.app{border-radius:10px;overflow:hidden}
.sens{transition:filter .2s}
.redact .sens{filter:blur(4px);background:#cbd5e1;color:transparent!important;border-radius:3px}
.wm{position:absolute;display:flex;align-items:center;gap:7px;font:600 13px/1 var(--ui);z-index:3}
.wm i{width:18px;height:18px;border-radius:6px;background:var(--acc)}
.wm.pill{padding:7px 11px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(10px)}
.E{display:flex;flex-direction:column;width:420px;overflow:hidden}
.E .top{padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
.E .strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.E .strip .look{flex:none;width:92px}.E .strip .look .mini{height:54px}.E .strip .look .lname{padding:4px 7px 5px;font-size:10.5px}
.E .main{flex:1;display:flex;min-height:0;border-top:.5px solid var(--line)}
.E .rail{flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-right:.5px solid var(--line)}
.E .rail button{width:50px;padding:7px 0 6px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg2);font-size:9.5px;font-weight:600}
.E .rail button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 0 16px rgba(255,214,10,.45)}
.E .pane{flex:1;padding:12px 14px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.E .grp{display:flex;flex-direction:column;gap:7px}
.E .grp>.cap{display:flex;align-items:center;gap:6px}
.src{margin-left:auto;font:600 9px/1 var(--ui);letter-spacing:.02em;text-transform:none;padding:3px 6px;border-radius:99px;background:var(--fill);color:var(--fg3)}
.hv .rev{max-height:0;opacity:0;overflow:hidden;transition:max-height .2s,opacity .2s,margin .2s}
.hv:hover .rev,.hv:focus-within .rev{max-height:40px;opacity:1;margin-top:7px}
.vt small{display:block;font-size:9px;color:var(--fg3);margin-top:1px}
.dims{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--fg2)}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-12px);opacity:0;transition:.25s;z-index:120;padding:9px 14px;border-radius:12px;background:rgba(0,0,0,.82);color:#fff;font-weight:600;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- prototype switcher (not part of the design) ---------- */
#sw{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:4px;padding:4px;border-radius:99px;background:#000;color:#fff;font:600 12px/1 var(--ui);box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.2)}
#sw button{height:28px;min-width:28px;padding:0 10px;border-radius:99px;color:#fff}
#sw button:hover{background:rgba(255,255,255,.14)}
#sw .cur{min-width:210px;text-align:center}
#state{position:fixed;left:16px;bottom:56px;z-index:100;max-height:50vh;overflow:auto;margin:0;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.85);color:#9fe;font:10.5px/1.45 ui-monospace,Menlo,monospace;display:none;white-space:pre}
#state.show{display:block}
</style>
</head>
<body>
<div id="desk"></div>
<div id="scene">
  <div id="canvas"><div id="fit"></div></div>
  <div id="side"></div>
</div>
<div id="dock" class="glass"></div>
<pre id="state"></pre>
<div id="toast"></div>
<div id="sw">
  <button data-sw="-1" title="Previous (←)">‹</button>
  <span class="cur" id="swcur"></span>
  <button data-sw="1" title="Next (→)">›</button>
  <button id="swtheme" title="Light / dark">◐</button>
  <button id="swstate" title="Show state">{ }</button>
</div>

<script>
/* ---------- data ---------- */

function harmony(base, kind){
  const [h,s,l] = hsl(base), S2 = Math.max(s,.55), L = Math.min(Math.max(l,.45),.68);
  const m = {analogous:[[0,0],[28,.05],[-28,-.05]], complementary:[[0,0],[180,0],[150,.08]], triad:[[0,0],[120,0],[240,0]], mono:[[0,0],[0,.18],[0,-.18]]}[kind];
  return m.map(([dh,dl]) => fromHsl((h+dh+360)%360, S2, Math.min(.85,Math.max(.2,L+dl))));
}

  const kinds = ['analogous','complementary','triad','mono'];
  const kind = U.D.harmony || kinds[Math.floor(Math.random()*4)];

  if (push) S.history = [JSON.parse(JSON.stringify(S.custom)), ...S.history].slice(0,8);
}

const VARIANTS = {A:['Inspector',VariantA], B:['Looks first',VariantB], C:['Rail + library',VariantC], D:['Generator',VariantD], E:['Everything',VariantE]};

const parse = v => v==='true'?true : v==='false'?false : v!=='' && !isNaN(v) && !/^#/.test(v) ? +v : v;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-k],[data-ua],[data-ug],[data-ub],[data-uc],[data-ucp],[data-ud],[data-ue],[data-sw]');
  if (!t || t.matches('input')) return;
  const d = t.dataset;
  if (d.sw){ const ks = Object.keys(VARIANTS); go(ks[(ks.indexOf(variant)+ +d.sw+ks.length)%ks.length]); return; }
  if (d.act==='fav'){ e.stopPropagation(); S.favorites = S.favorites.includes(d.v) ? S.favorites.filter(x=>x!==d.v) : [...S.favorites, d.v]; }
  else if (d.act==='bg') pickBg(d.v);
  else if (d.act==='shuffle'){ const pool = ALL.filter(x=>x!==S.bg && x!=='clear'); pickBg(pool[Math.floor(Math.random()*pool.length)]); }
  else if (d.act==='look'){ const l = [...LOOKS, ...S.myLooks].find(x=>x[0]===d.v); Object.assign(S, JSON.parse(JSON.stringify(l[3]))); U.B.look = d.v; }
  else if (d.act==='savelook'){ const n = S.myLooks.length+1; const keys = ['bg','frame','shadow','shadowAmt','ratio','tilt','heading','pattern','patternAmt','padding','radius','bleed','pos','custom'];
    S.myLooks.push([`mine${n}`, `My look ${n}`, title(S.bg), JSON.parse(JSON.stringify(Object.fromEntries(keys.map(k=>[k,S[k]]))))]); U.B.look = `mine${n}`; }
  else if (d.act==='generate') generate();
  else if (d.act==='fromshot'){ S.custom.colors = [...SHOT_PALETTE]; S.bg = 'custom'; S.history = [JSON.parse(JSON.stringify(S.custom)), ...S.history].slice(0,8); }
  else if (d.act==='hist'){ S.custom = JSON.parse(JSON.stringify(S.history[+d.v])); S.bg = 'custom'; }
  else if (d.act==='pad' || d.act==='dial' || d.act==='upload') return;
  else if (d.ua){ U.A.open[d.ua] = !U.A.open[d.ua]; }
  else if (d.ug){ U.A.group = d.ug; }
  else if (d.ub){ U.B.tab = d.ub; }
  else if (d.uc){ U.C[d.uc] = d.v; }
  else if (d.ucp){ U.C.panel = U.C.panel===d.ucp ? null : d.ucp; }
  else if (d.ud){ U.D.harmony = d.v==='any' ? null : d.v; }
  else if (d.k==='__src'){ U.D.src = d.v; }
  else if (d.ue){ U.E[d.ue] = parse(d.v); }
  else if (d.act==='magic'){ S.custom = JSON.parse(JSON.stringify(magicSet()[+d.v])); S.bg = 'custom'; }
  else if (d.act==='magicpreset'){ const l = LOOKS[Math.floor(Math.random()*LOOKS.length)]; Object.assign(S, JSON.parse(JSON.stringify(l[3])));
    const m = magicSet(); S.custom = JSON.parse(JSON.stringify(m[Math.floor(Math.random()*m.length)])); S.bg = 'custom'; U.B.look = null; }
  else if (d.act==='export'){ const t = document.getElementById('toast'); t.textContent = `${d.v} · ${S.fmt} ${S.res} · ${exportDims()}`; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1600); }
  else if (d.k){ set(d.k, parse(d.v)); if (d.k.startsWith('custom')) S.bg = 'custom'; if (variant==='B') U.B.look = null; }
  renderAll();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id==='cq'){ U.C.q = t.value; document.getElementById('clib').innerHTML = cLibrary(); return; }
  if (!t.dataset.k) return;
  const k = t.dataset.k;
  set(k, t.type==='range'||t.type==='number' ? +t.value : t.value);
  if (k.startsWith('custom')) S.bg = 'custom';
  if (t.type==='range') t.nextElementSibling.textContent = FMT[k](+t.value);
  renderPreview();
  if (t.type==='color') { const w = t.closest('label'); if (w) w.style.background = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act==='upload' && t.files[0]){ S.uploadUrl = URL.createObjectURL(t.files[0]); pickBg('upload'); renderAll(); }
  if (t.type==='color') renderAll();
});
// XY pad and angle dial: pointer drag
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act=pad],[data-act=dial]'); if (!el) return;
  const r = el.getBoundingClientRect();
  const move = ev => {
    if (el.dataset.act==='pad'){
      const x = Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)), y = Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height));
      S.padding = Math.round(x*200); S.shadowAmt = +(1-y).toFixed(2);
      el.querySelector('.knob').style.cssText = `left:${x*100}%;top:${y*100}%`;
    } else {
      S.custom.angle = Math.round((Math.atan2(ev.clientY-(r.top+r.height/2), ev.clientX-(r.left+r.width/2))*180/Math.PI + 90 + 360) % 360); S.bg = 'custom';
      el.querySelector('i').style.transform = `rotate(${S.custom.angle+180}deg)`;
    }
    renderPreview();
  };
  move(e); el.setPointerCapture(e.pointerId);
  el.onpointermove = move; el.onpointerup = () => { el.onpointermove = null; renderSide(); };
});
function go(v){ variant = v; const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null,'',u); renderAll(); }
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key==='ArrowLeft' || e.key==='ArrowRight'){ const ks = Object.keys(VARIANTS); go(ks[(ks.indexOf(variant)+(e.key==='ArrowRight'?1:-1)+ks.length)%ks.length]); }
});
document.getElementById('swtheme').onclick = () => { const r = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = r.dataset.theme || (dark?'dark':'light'); r.dataset.theme = cur==='dark'?'light':'dark'; };
document.getElementById('swstate').onclick = () => document.getElementById('state').classList.toggle('show');
addEventListener('resize', renderPreview);
if (!VARIANTS[variant]) variant = 'A';
S.history = []; generate(false); S.bg = 'peach';
renderAll();
</script>
</body>
